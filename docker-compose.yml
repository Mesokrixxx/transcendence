services:
  db:
    image: docker.io/library/postgres:17-bookworm
    container_name: transcendence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - network-backend-db
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Containerfile
    container_name: transcendence-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - network-backend-db
      - network-frontend-backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Containerfile
    container_name: transcendence-frontend
    restart: unless-stopped
    depends_on: 
      - backend
    networks:
      - network-frontend-backend
      - network-nginx-frontend

  nginx:
    build:
      context: ./nginx
      dockerfile: Containerfile
    container_name: transcendence-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - '4243:4243'
    networks:
      - network-nginx-frontend
      - network-frontend-backend

volumes:
  postgres_data:

networks:
  network-backend-db:
    internal: true
  network-frontend-backend:
    internal: true
  network-nginx-frontend:
    internal: true
